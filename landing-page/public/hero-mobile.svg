    <circle cx="14" cy="16" r="4.5" fill="#ff5f57"/>
    <circle cx="28" cy="16" r="4.5" fill="#ffbd2e"/>
    <circle cx="42" cy="16" r="4.5" fill="#28c840"/>

    <!-- VS Code Tabs -->
    <g transform="translate(52, 0)">
      <rect x="0" y="0" width="120" height="32" fill="#2d2d2d"/>
      <rect x="1" y="32" width="118" height="1" fill="#1e1e1e"/>
      <text x="14" y="20" fill="#ccc" font-family="sans-serif" font-size="10">vector_search.py</text>

      <rect x="120" y="0" width="100" height="32" fill="#1e1e1e"/>
      <text x="134" y="20" fill="#666" font-family="sans-serif" font-size="10">config.yaml</text>
    </g>

    <!-- Activity Bar (left icon strip, simplified) -->
    <rect x="0" y="32" width="36" height="368" fill="#333"/>
    <g transform="translate(0, 32)">
      <rect x="0" y="6" width="36" height="36" fill="rgba(255,255,255,0.06)"/>
      <rect x="8" y="14" width="20" height="20" rx="3" fill="none" stroke="#0D9488" stroke-width="1.5"/>
    </g>

    <!-- Sidebar (simplified) -->
    <rect x="36" y="32" width="140" height="368" fill="#252526"/>
    <text x="48" y="56" fill="#bbb" font-family="sans-serif" font-size="9" font-weight="600">EXPLORER</text>

    <g transform="translate(44, 70)" font-family="sans-serif" font-size="10" fill="#999">
      <text x="0" y="0" fill="#ccc">▶ ash-vector-search</text>

      <g transform="translate(12, 18)">
        <text x="0" y="0" fill="#ccc">▶ src</text>
        <g transform="translate(12, 18)">
          <text x="0" y="0" fill="#ccc">main.py</text>
          <rect x="-6" y="14" width="120" height="18" rx="2" fill="#37373d"/>
          <text x="0" y="26" fill="#ccc">vector_search.py</text>
          <text x="0" y="44" fill="#999">config.yaml</text>
        </g>
      </g>
    </g>

    <!-- Editor area (compact) -->
    <g transform="translate(180, 56)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10">
      <g fill="#484848">
        <text x="0" y="10" text-anchor="end">1</text>
        <text x="0" y="22" text-anchor="end">2</text>
        <text x="0" y="34" text-anchor="end">3</text>
        <text x="0" y="46" text-anchor="end">4</text>
        <text x="0" y="58" text-anchor="end">5</text>
        <text x="0" y="70" text-anchor="end">6</text>
      </g>

      <g transform="translate(24, 0)">
        <text x="0" y="10" fill="#569cd6">import</text>
        <text x="40" y="10" fill="#9cdcfe">os</text>
        <text x="0" y="22" fill="#569cd6">from</text>
        <text x="28" y="22" fill="#9cdcfe">qdrant_client</text>
        <text x="108" y="22" fill="#569cd6">import</text>
        <text x="140" y="22" fill="#9cdcfe">QdrantClient</text>

        <text x="0" y="46" fill="#569cd6">def</text>
        <text x="24" y="46" fill="#dcdcaa">setup_collection</text>
        <text x="120" y="46" fill="#d4d4d4">():</text>

        <text x="16" y="58" fill="#9cdcfe">client</text>
        <text x="56" y="58" fill="#d4d4d4">=</text>
        <text x="68" y="58" fill="#9cdcfe">QdrantClient</text>
        <text x="136" y="58" fill="#d4d4d4">(</text>
        <text x="142" y="58" fill="#ce9178">"localhost"</text>
        <text x="192" y="58" fill="#d4d4d4">,</text>
        <text x="198" y="58" fill="#dcdcaa">port</text>
        <text x="218" y="58" fill="#d4d4d4">=</text>
        <text x="226" y="58" fill="#b5cea8">6333</text>
        <text x="244" y="58" fill="#d4d4d4">)</text>

        <text x="16" y="70" fill="#9cdcfe">client</text>
        <text x="56" y="70" fill="#dcdcaa">recreate_collection</text>
        <text x="160" y="70" fill="#d4d4d4">(</text>
        <text x="166" y="70" fill="#dcdcaa">collection_name</text>
        <text x="266" y="70" fill="#d4d4d4">=</text>
        <text x="276" y="70" fill="#ce9178">"documents"</text>
        <text x="338" y="70" fill="#d4d4d4">,</text>
      </g>
    </g>

    <!-- Status bar -->
    <rect x="36" y="380" width="740" height="18" fill="#0D9488"/>
    <text x="46" y="392" fill="#fff" font-family="sans-serif" font-size="9">main</text>
    <text x="80" y="392" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="9">Ln 6, Col 18</text>
