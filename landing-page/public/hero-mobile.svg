    <!-- Main content (simplified) -->
    <g transform="translate(176, 60)">
      <text x="0" y="0" fill="#f1f5f9" font-family="sans-serif" font-size="18" font-weight="600">Dashboard</text>
      <text x="0" y="18" fill="#64748b" font-family="sans-serif" font-size="10">Vector database overview</text>

      <!-- Stats row -->
      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="136" height="60" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="10" y="18" fill="#94a3b8" font-family="sans-serif" font-size="9">Collections</text>
        <text x="10" y="46" fill="#f1f5f9" font-family="sans-serif" font-size="22" font-weight="700">4</text>

        <rect x="148" y="0" width="136" height="60" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="158" y="18" fill="#94a3b8" font-family="sans-serif" font-size="9">Vectors</text>
        <text x="158" y="46" fill="#f1f5f9" font-family="sans-serif" font-size="22" font-weight="700">1.2M</text>

        <rect x="296" y="0" width="136" height="60" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="306" y="18" fill="#94a3b8" font-family="sans-serif" font-size="9">Storage</text>
        <text x="306" y="46" fill="#f1f5f9" font-family="sans-serif" font-size="22" font-weight="700">2.4 GB</text>

        <rect x="444" y="0" width="136" height="60" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="454" y="18" fill="#94a3b8" font-family="sans-serif" font-size="9">Latency</text>
        <text x="454" y="46" fill="#f1f5f9" font-family="sans-serif" font-size="22" font-weight="700">12ms</text>
      </g>

      <!-- Collections list -->
      <g transform="translate(0, 116)">
        <text x="0" y="0" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Collections</text>

        <g transform="translate(0, 14)">
          <!-- Header -->
          <rect x="0" y="0" width="580" height="26" rx="4" fill="#1e293b"/>
          <text x="12" y="17" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">NAME</text>
          <text x="100" y="17" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">VECTORS</text>
          <text x="200" y="17" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">STATUS</text>

          <!-- Row 1 -->
          <rect x="0" y="30" width="580" height="28" rx="4" fill="rgba(255,255,255,0.02)"/>
          <circle cx="16" cy="44" r="5" fill="#0D9488" opacity="0.3"/>
          <text x="12" y="48" fill="#e2e8f0" font-family="sans-serif" font-size="10">documents</text>
          <text x="100" y="48" fill="#cbd5e1" font-family="sans-serif" font-size="10">845.3k</text>
          <circle cx="208" cy="44" r="3" fill="#4ade80"/>

          <!-- Row 2 -->
          <rect x="0" y="62" width="580" height="28" rx="4" fill="rgba(255,255,255,0.02)"/>
          <circle cx="16" cy="76" r="5" fill="#6366f1" opacity="0.3"/>
          <text x="12" y="80" fill="#e2e8f0" font-family="sans-serif" font-size="10">embeddings</text>
          <text x="100" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="10">321.0k</text>
          <circle cx="208" cy="76" r="3" fill="#4ade80"/>

          <!-- Row 3 -->
          <rect x="0" y="94" width="580" height="28" rx="4" fill="rgba(255,255,255,0.02)"/>
          <circle cx="16" cy="108" r="5" fill="#f59e0b" opacity="0.3"/>
          <text x="12" y="112" fill="#e2e8f0" font-family="sans-serif" font-size="10">images</text>
