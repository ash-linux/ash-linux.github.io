<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#1e1e22"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d3d42"/>
      <stop offset="100%" stop-color="#2a2a2e"/>
    </linearGradient>
    <linearGradient id="browserTitleBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#e2e2e2"/>
    </linearGradient>
    <filter id="windowShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Desktop Wallpaper -->
  <rect width="800" height="1200" fill="url(#wallpaper)"/>

  <!-- ===== TOP BAR ===== -->
  <rect width="800" height="28" fill="url(#topbar)" opacity="0.95"/>
  <rect width="800" height="1" y="28" fill="rgba(255,255,255,0.06)"/>

  <!-- Activities -->
  <rect x="6" y="4" width="76" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
  <text x="44" y="17" fill="#ddd" font-family="sans-serif" font-size="10" font-weight="500" text-anchor="middle">Activities</text>

  <!-- Clock -->
  <text x="400" y="17" fill="#eee" font-family="sans-serif" font-size="10" font-weight="500" text-anchor="middle">Fri Jul 17  2:41 PM</text>

  <!-- System Tray (simplified) -->
  <rect x="750" y="9" width="14" height="9" rx="1.5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <rect x="752" y="11" width="10" height="5" rx="0.8" fill="#0D9488"/>
  <path d="M772 14 Q776 8 780 14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

  <!-- ===== TERMINAL WINDOW ===== -->
  <g filter="url(#windowShadow)" transform="translate(12, 38)">
    <rect width="776" height="340" rx="6" fill="#1a1a1a"/>
    <rect width="776" height="32" rx="6" fill="url(#titleBar)"/>
    <rect x="0" y="32" width="776" height="1" fill="rgba(255,255,255,0.06)"/>
    <rect x="0" y="32" width="776" height="308" fill="#0d0d0d"/>

    <!-- Title bar dots -->
    <circle cx="14" cy="16" r="4.5" fill="#ff5f57"/>
    <circle cx="28" cy="16" r="4.5" fill="#ffbd2e"/>
    <circle cx="42" cy="16" r="4.5" fill="#28c840"/>

    <!-- Title -->
    <text x="388" y="20" fill="#bbb" font-family="sans-serif" font-size="11" text-anchor="middle">ollama run llama3.1</text>

    <!-- Terminal content -->
    <g transform="translate(14, 52)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">
      <text x="0" y="0" fill="#0D9488">ash@arch</text>
      <text x="72" y="0" fill="#888">:</text>
      <text x="80" y="0" fill="#4ade80">~</text>
      <text x="92" y="0" fill="#888">$</text>
      <text x="104" y="0" fill="#ccc">ollama pull llama3.1</text>

      <text x="0" y="22" fill="#888">pulling manifest</text>
      <text x="0" y="40" fill="#888">pulling 8a0d2f7c...</text>
      <text x="180" y="40" fill="#4ade80">✓</text>
      <text x="0" y="58" fill="#888">verifying sha256 digest</text>
      <text x="0" y="76" fill="#4ade80">✓ success</text>

      <text x="0" y="108" fill="#0D9488">ash@arch</text>
      <text x="72" y="108" fill="#888">:</text>
      <text x="80" y="108" fill="#4ade80">~</text>
      <text x="92" y="108" fill="#888">$</text>
      <text x="104" y="108" fill="#ccc">ollama run llama3.1</text>

      <text x="0" y="136" fill="#888">>>> Write a Python function to</text>
      <text x="0" y="154" fill="#888">find similar vectors in Qdrant</text>

      <text x="0" y="184" fill="#4ade80">def find_similar(</text>
      <text x="0" y="202" fill="#4ade80">    client: QdrantClient,</text>
      <text x="0" y="220" fill="#4ade80">    collection: str,</text>
      <text x="0" y="238" fill="#4ade80">    vector: list[float],</text>
      <text x="0" y="256" fill="#4ade80">    limit: int = 10</text>
      <text x="0" y="274" fill="#4ade80">) -> list[ScoredPoint]:</text>
      <text x="0" y="292" fill="#4ade80">    return client.search(...)</text>
    </g>
  </g>

  <!-- ===== VS CODE WINDOW ===== -->
  <g filter="url(#windowShadow)" transform="translate(12, 392)">
    <rect width="776" height="400" rx="6" fill="#1e1e1e"/>
    <rect width="776" height="32" rx="6" fill="#3c3c3c"/>
    <rect x="0" y="32" width="776" height="1" fill="rgba(255,255,255,0.08)"/>

