    <!-- Qdrant badge -->
    <rect x="580" y="354" width="68" height="16" rx="3" fill="#0D9488" opacity="0.15"/>
    <text x="614" y="365" fill="#0D9488" font-family="sans-serif" font-size="8" text-anchor="middle">Qdrant v1.13</text>
